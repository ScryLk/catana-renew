<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100" fill="none">
  <!-- SKINSYNC — Synchronization Gesture (Product → Person → Routine) -->
  <defs>
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCD7D0" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#C5BFB7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#AFA89F" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="lineGradRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DCD7D0" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#C5BFB7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#AFA89F" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFA89F" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#D5D0C9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#AFA89F" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Delicate central synchronization orbit -->
  <ellipse cx="140" cy="50" rx="34" ry="14" stroke="url(#orbitGrad)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Flowing convergence curves -->
  <!-- Left incoming stream (Product / Technology) -->
  <path d="M 20,38 C 70,38 100,50 140,50" stroke="url(#lineGradLeft)" stroke-width="0.85" stroke-linecap="round" />

  <!-- Right incoming stream (Person / Routine) -->
  <path d="M 260,62 C 210,62 180,50 140,50" stroke="url(#lineGradRight)" stroke-width="0.85" stroke-linecap="round" />

  <!-- Central convergence point / L'Oréal muted burgundy accent -->
  <circle cx="140" cy="50" r="1.5" fill="#7E1B28" opacity="0.9" />
</svg>
