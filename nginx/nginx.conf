upstream backend_api {
    server backend:8000;
}

# 1. HTTP Server - Redirecionamento 301 para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name usecatana.com.br www.usecatana.com.br 179.236.238.62 srv2029979.hstgr.cloud _;

    # Certbot ACME Challenge para renovacoes SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o trafego HTTP para HTTPS canonico
    location / {
        return 301 https://usecatana.com.br$request_uri;
    }
}

# 2. Redirecionamento HTTPS de www.usecatana.com.br para https://usecatana.com.br
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.usecatana.com.br;

    ssl_certificate /etc/letsencrypt/live/usecatana.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecatana.com.br/privkey.pem;

    return 301 https://usecatana.com.br$request_uri;
}

# 3. Servidor Principal HTTPS de Producao
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name usecatana.com.br;

    client_max_body_size 60M;

    # Certificados SSL & Criptografia
    ssl_certificate /etc/letsencrypt/live/usecatana.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usecatana.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets with hash
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }

    # Django Admin Interface
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django Static Files (Admin, DRF)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # User Media Files (Uploaded images, exports, previews)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
