services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-catana_db}
      - POSTGRES_USER=${POSTGRES_USER:-catana_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variavel POSTGRES_PASSWORD obrigatoria para inicializacao de banco}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catana_user} -d ${POSTGRES_DB:-catana_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn catana_back.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?Variavel SECRET_KEY obrigatoria}
      - DATABASE_URL=${DATABASE_URL:?Variavel DATABASE_URL obrigatoria}
      - DEBUG=${DEBUG:-False}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
