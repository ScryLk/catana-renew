services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catana_backend
    restart: unless-stopped
    volumes:
      - ./backend/media:/app/media
      - catana_static:/app/staticfiles
      - ./backend/db.sqlite3:/app/db.sqlite3
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-usecatana.com.br,www.usecatana.com.br,179.236.238.62,srv2029979.hstgr.cloud,localhost,127.0.0.1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/db.sqlite3}
      - KATANA_FRONTEND_URL=${KATANA_FRONTEND_URL:-https://usecatana.com.br}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://usecatana.com.br,https://www.usecatana.com.br}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://usecatana.com.br,https://www.usecatana.com.br}
    networks:
      - catana_network

  web:
    image: nginx:alpine
    container_name: catana_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - catana_static:/var/www/static:ro
      - ./backend/media:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - catana_network

  certbot:
    image: certbot/certbot
    container_name: catana_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - catana_network

volumes:
  catana_static:

networks:
  catana_network:
    driver: bridge
