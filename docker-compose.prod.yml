services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catana_backend
    restart: unless-stopped
    volumes:
      - ./backend/media:/app/media
      - catana_static:/app/staticfiles
      - ./backend/db.sqlite3:/app/db.sqlite3
    environment:
      - SECRET_KEY=${SECRET_KEY:-catana-prod-secret-k8s9f7a6b5c4d3e2f1m0}
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=sqlite:////app/db.sqlite3
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6J8pBpGDgddPDGtKRFqlpp0UX7L2hYMsYwXe3sEeEoGJg}
      - AI_DEFAULT_MODEL=gemini-flash-latest
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-904359527417-v2v0kkr40ed2of63csljt8fpe91ocpd2.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-pk_test_cGxlYXNlZC1ndWxsLTU3MTEuY2xlcmsuYWNjb3VudHMuZGV2JA}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-sk_test_Ul3yF8aL7WlDNJJXaEqBZLSPJDoFoTwC5JnmEjlfdw}
      - CLERK_JWKS_URL=https://pleased-gull-5711.clerk.accounts.dev/.well-known/jwks.json
      - ABACATEPAY_API_KEY=${ABACATEPAY_API_KEY:-abc_dev_Z4PzfG24Gb0AMmS1mtJMN1WG}
      - KATANA_FRONTEND_URL=https://usecatana.com.br
      - SECURE_SSL_REDIRECT=False
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - CORS_ALLOWED_ORIGINS=https://usecatana.com.br,http://usecatana.com.br,https://www.usecatana.com.br,http://www.usecatana.com.br,http://179.236.238.62,http://srv2029979.hstgr.cloud,http://localhost,http://127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://usecatana.com.br,http://usecatana.com.br,https://www.usecatana.com.br,http://www.usecatana.com.br,http://179.236.238.62,http://srv2029979.hstgr.cloud,http://localhost,http://127.0.0.1
    networks:
      - catana_network

  web:
    image: nginx:alpine
    container_name: catana_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - catana_static:/var/www/static:ro
      - ./backend/media:/var/www/media:ro
    depends_on:
      - backend
    networks:
      - catana_network

  certbot:
    image: certbot/certbot
    container_name: catana_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - catana_network

volumes:
  catana_static:

networks:
  catana_network:
    driver: bridge
