name: Production readiness audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-backend-suite:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////tmp/catana-ci.sqlite3
      GEMINI_API_KEY: ''
      ABACATEPAY_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: bash scripts/run_backend_checks.sh
  full-frontend-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/check_contract_parity.py
      - run: node scripts/check_font_registry.mjs
  determinism:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////tmp/catana-ci.sqlite3
      GEMINI_API_KEY: ''
      ABACATEPAY_API_KEY: ''
    strategy:
      fail-fast: false
      matrix:
        hashseed: ['1', '42', '999']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check_generative_invariants.py
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
  security-smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////tmp/catana-ci.sqlite3
      GEMINI_API_KEY: ''
      ABACATEPAY_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: cd backend && python manage.py test api.tests_production_gate api.tests_security_audit_remediation --noinput
  production-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read-only production comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main refs/heads/production:refs/remotes/origin/production
          git log --oneline origin/production..origin/main > production-diff.txt
          git diff --stat origin/production...origin/main >> production-diff.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-diff
          path: production-diff.txt
  report:
    if: always()
    needs: [full-backend-suite, full-frontend-suite, build, contracts, determinism, security-smoke, production-diff]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: needs.production-diff.result == 'success'
        with:
          name: production-diff
      - name: Record audit outcomes
        env:
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          BACKEND: ${{ needs.full-backend-suite.result }}
          FRONTEND: ${{ needs.full-frontend-suite.result }}
          BUILD: ${{ needs.build.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          DETERMINISM: ${{ needs.determinism.result }}
          SECURITY: ${{ needs.security-smoke.result }}
          DIFF: ${{ needs.production-diff.result }}
        run: |
          {
            echo "COMMIT: $COMMIT_SHA"
            echo "BRANCH: $SOURCE_REF"
            echo "BACKEND TESTS: $BACKEND"
            echo "FRONTEND TESTS: $FRONTEND"
            echo "FRONTEND BUILD: $BUILD"
            echo "CONTRACT PARITY: $CONTRACTS"
            echo "FONT REGISTRY: $CONTRACTS"
            echo "DETERMINISM: $DETERMINISM"
            echo "COMMERCIAL INTEGRITY: $SECURITY"
            echo "QUALITY GATE: $SECURITY"
            echo "SECURITY: $SECURITY"
            echo "PRODUCTION DIFF: $DIFF"
            echo "PRODUCTION MODIFIED: NO"
            if [ -f production-diff.txt ]; then cat production-diff.txt; fi
          } > production-readiness-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-readiness-report
          path: production-readiness-report.txt
