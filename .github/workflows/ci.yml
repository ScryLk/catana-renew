name: Generative quality gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  social-auth-contracts:
    outputs:
      provider_isolation: ${{ steps.provider_isolation.outcome }}
      clerk_social: ${{ steps.clerk_social.outcome }}
      legacy_isolation: ${{ steps.legacy_isolation.outcome }}
      coop: ${{ steps.coop.outcome }}
      frontend_auth_build: ${{ steps.frontend_auth_build.outcome }}
      social_browser: ${{ steps.social_browser.outcome }}
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////tmp/catana-social-auth-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - name: AUTH PROVIDER ISOLATION
        id: provider_isolation
        run: npm test --prefix frontend -- src/services/authProviderRouting.test.tsx src/store/authProviderIsolation.test.ts
      - name: CLERK SOCIAL AUTH
        id: clerk_social
        if: always()
        run: npm test --prefix frontend -- src/components/auth/ClerkAuthExperience.test.tsx src/components/auth/ClerkAuthSync.test.tsx
      - name: LEGACY AUTH ISOLATION
        id: legacy_isolation
        if: always()
        run: |
          npm test --prefix frontend -- src/components/auth/LegacyGoogleLoginButton.test.tsx
          cd backend && python manage.py test api.tests_social_auth --noinput
      - name: COOP CONFIGURATION
        id: coop
        if: always()
        run: |
          node --test scripts/check_coop_config.test.mjs
          node scripts/check_coop_config.mjs
          bash scripts/test_nginx_coop.sh
      - name: FRONTEND AUTH BUILD CONFIG
        id: frontend_auth_build
        if: always()
        run: node --test scripts/frontend_build_config.test.mjs
      - name: SOCIAL AUTH BROWSER QA
        id: social_browser
        if: always()
        run: |
          npx --prefix frontend playwright install --with-deps chromium
          cd frontend && npx playwright test --config playwright.social-auth.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-auth-browser-evidence
          path: |
            frontend/playwright-report-social-auth/
            frontend/test-results-social-auth/
          retention-days: 14
  auth-session-contracts:
    outputs:
      auth: ${{ steps.auth.outcome }}
      workspace: ${{ steps.workspace.outcome }}
      protocol: ${{ steps.protocol.outcome }}
      backend_config: ${{ steps.backend_config.outcome }}
      build_env: ${{ steps.build_env.outcome }}
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/catana_auth_ci
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: catana_auth_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - name: Auth session tests
        id: auth
        run: npm test --prefix frontend -- src/store/authSession.test.ts src/services/authTokenProvider.test.ts src/components/auth/ClerkAuthSync.test.tsx src/components/auth/PrivateRoute.test.tsx
      - name: Workspace isolation
        id: workspace
        run: npm test --prefix frontend -- src/store/workspaceSession.test.ts src/store/studioStore.isolation.test.ts
      - name: Agent protocol
        id: protocol
        run: |
          npm test --prefix frontend -- src/utils/agentProtocol.test.ts src/components/studio/AgentChatStream.test.tsx src/services/documentImportService.test.tsx
          cd backend && python manage.py test api.tests_agent_protocol.AgentProtocolTests api.tests_agent_protocol.AgentOutputParserTests api.tests_agent_protocol.ClerkProvisioningTests api.tests_agent_protocol.ClerkProvisioningConcurrencyTests --noinput
      - name: Backend auth configuration check
        id: backend_config
        run: cd backend && python manage.py test api.tests_agent_protocol.BackendAuthPreflightTests --noinput
      - name: Frontend build environment
        id: build_env
        run: node --test scripts/frontend_build_config.test.mjs
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////tmp/catana-ci.sqlite3
      GEMINI_API_KEY: ''
      ABACATEPAY_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: bash scripts/run_backend_checks.sh
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: node scripts/frontend_build_config.mjs
        env:
          VITE_AUTH_PROVIDER: clerk
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      - run: npm run build --prefix frontend
        env:
          VITE_AUTH_PROVIDER: clerk
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/check_contract_parity.py
      - run: node scripts/check_font_registry.mjs
  determinism-checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-nonproduction-key-for-isolated-tests
      DEBUG: 'True'
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////tmp/catana-ci.sqlite3
      GEMINI_API_KEY: ''
      ABACATEPAY_API_KEY: ''
    strategy:
      fail-fast: false
      matrix:
        hashseed: ['1', '42', '999']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check_generative_invariants.py
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
